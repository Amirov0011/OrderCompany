spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/FirstExampleDatabase
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
        group-id: order-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
        properties:
          spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
          spring.json.trusted.packages: "*"
          spring.json.type.mapping: "az.paymentcompany.model.event.PaymentResultEvent:az.ordercompany.model.event.PaymentResultEvent,company.productscompany.Model.event.PaymentResultEvent:az.ordercompany.model.event.PaymentResultEvent"
    producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 4444

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

